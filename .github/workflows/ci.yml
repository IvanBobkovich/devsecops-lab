name: Python Linting

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install linter
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      
      - name: Run linter
        run: |
          echo "Checking code style..."
          flake8 app.py --max-line-length=120 || echo "Linting failed!"
